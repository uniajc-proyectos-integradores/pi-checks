# Composite action de PI Checks. Los repos estudiantiles la usan con:
#   uses: uniajc-proyectos-integradores/pi-checks@v1
# Descarga el jar ya compilado de la release v1.0.0 (PI-005) en vez de
# compilar en cada run: los repos de equipo son privados y cada minuto
# de Actions cuenta contra la bolsa mensual de la organizacion (decision #31).
name: "PI Checks"
description: "Feedback temprano para repositorios Java del Proyecto Integrador UNIAJC. Genera evidencia pedagógica; no asigna notas."
branding:
  icon: "check-circle"
  color: "blue"

runs:
  using: "composite"
  steps:
    - name: Configurar Java 17
      # actions/setup-java@v4.9.1, pineado por SHA (PI-005)
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: "17"

    - name: Descargar pi-checks.jar de la release v1.0.0
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download v1.0.0 \
          --repo uniajc-proyectos-integradores/pi-checks \
          --pattern pi-checks.jar \
          --dir "${{ runner.temp }}/pi-checks" \
          --clobber

    - name: Ejecutar checks
      shell: bash
      run: java -jar "${{ runner.temp }}/pi-checks/pi-checks.jar" "$GITHUB_WORKSPACE"
