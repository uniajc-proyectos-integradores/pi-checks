# Composite action de PI Checks.
# Cuando pi-checks se publique en la organización (PI-005), los repos
# estudiantiles la usan con:   uses: uniajc-proyectos-integradores/pi-checks@v1
# PI-005 además reemplazará el paso de compilación por la descarga del jar de
# la release (decisión #31: los repos privados facturan minutos de Actions).
name: "PI Checks"
description: "Feedback temprano para repositorios Java del Proyecto Integrador UNIAJC. Genera evidencia pedagógica; no asigna notas."
branding:
  icon: "check-circle"
  color: "blue"

runs:
  using: "composite"
  steps:
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    - name: Construir pi-checks
      shell: bash
      run: mvn -q -f "${{ github.action_path }}/pom.xml" package -DskipTests

    - name: Ejecutar checks
      shell: bash
      run: java -jar "${{ github.action_path }}/target/pi-checks.jar" "$GITHUB_WORKSPACE"
