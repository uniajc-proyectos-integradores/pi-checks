# Composite action de PI Checks. Los repos estudiantiles la usan con:
#   uses: uniajc-proyectos-integradores/pi-checks@v1
# Descarga el jar ya compilado de la release v1.0.0 (PI-005) en vez de
# compilar en cada run: los repos de equipo son privados y cada minuto
# de Actions cuenta contra la bolsa mensual de la organizacion (decision #31).
name: "PI Checks"
description: "Feedback temprano para repositorios Java del Proyecto Integrador UNIAJC. Genera evidencia pedagógica; no asigna notas."
branding:
  icon: "check-circle"
  color: "blue"

runs:
  using: "composite"
  steps:
    - name: Configurar Java 17
      # actions/setup-java@v4.9.1, pineado por SHA (PI-005)
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: "17"

    - name: Descargar y verificar pi-checks.jar de la release v1.0.0
      # Checksum fijo del jar de v1.0.0 (P1 auditoria Codex PR #12): un tag
      # de release es mutable -- fijar solo el nombre del tag no autentica
      # los bytes descargados. Si se publica un jar nuevo compatible con @v1,
      # este hash debe actualizarse en el mismo commit.
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download v1.0.0 \
          --repo uniajc-proyectos-integradores/pi-checks \
          --pattern pi-checks.jar \
          --dir "${{ runner.temp }}/pi-checks" \
          --clobber
        echo "7aba24e2844f26112e68e1487f35ab3bab18db2a722ca82e1fab894023d69a33  ${{ runner.temp }}/pi-checks/pi-checks.jar" | sha256sum -c -

    - name: Ejecutar checks
      shell: bash
      run: java -jar "${{ runner.temp }}/pi-checks/pi-checks.jar" "$GITHUB_WORKSPACE"

    # Escáner de secretos reconocido (PI-005, complementa a SecretosCheck).
    # Se instala el binario de gitleaks (MIT, sin licencia) directamente en
    # vez de usar gitleaks/gitleaks-action: ese wrapper exige
    # GITLEAKS_LICENSE de pago para cuentas de organización, y esta org no
    # tiene presupuesto (decisión #31/#34). --redact evita que un valor
    # detectado se imprima en el log.
    - name: Instalar gitleaks 8.30.1
      shell: bash
      run: |
        curl -fsSL -o "${{ runner.temp }}/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${{ runner.temp }}/gitleaks.tar.gz" | sha256sum -c -
        tar -xzf "${{ runner.temp }}/gitleaks.tar.gz" -C "${{ runner.temp }}" gitleaks
        chmod +x "${{ runner.temp }}/gitleaks"

    - name: Escanear secretos con gitleaks (nunca imprime el valor)
      shell: bash
      run: |
        "${{ runner.temp }}/gitleaks" detect --source "$GITHUB_WORKSPACE" --redact --no-banner --exit-code 1
