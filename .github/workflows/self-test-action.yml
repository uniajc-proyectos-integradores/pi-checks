name: Self-test de la composite action

# Valida uses: ./ (equivalente a como un repo estudiantil usaria
# uniajc-proyectos-integradores/pi-checks@v1) sobre un runner real, no
# solo localmente. Manual: no debe correr en cada push del repo del
# checker.
#
# repository_dispatch ademas de workflow_dispatch: el token de gh en uso
# (PI-005) tiene scope 'repo' pero no 'workflow', y la API de
# workflow_dispatch exige ese scope. repository_dispatch solo exige 'repo'
# (P1 auditoria Codex PR #12 -- "ejecutar y registrar el self-test").
on:
  workflow_dispatch:
  repository_dispatch:
    types: [self-test]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Ejecutar la propia action (uses: ./)
        uses: ./
