name: CI

# push solo en main + pull_request para ramas: evita el doble run por SHA
# en cada actualizacion de un PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0, pineado por SHA (PI-005)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Java 17
        # actions/setup-java@v4.9.1, pineado por SHA (PI-005)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Tests del checker
        run: mvn -q test

      - name: Empaquetar CLI
        run: mvn -q package -DskipTests

  # Corre la composite action publicada de verdad (uses: ./), no solo el jar
  # local -- mismo mecanismo que usaran los repos estudiantiles con @v1
  # (descarga de release, verificacion de checksum, gitleaks). P1 auditoria
  # Codex PR #12 de la plataforma: un CI verde del jar aislado no prueba el
  # action.yml distribuido.
  self-test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./
